<!-- @dsCard height=288 -->
<link rel="stylesheet" href="../bundle.css">
<style>
  html, body { margin: 0; }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--indigo50, #f7f5fc); font-family: var(--font-sans, Nunito, system-ui, sans-serif); }
  .cv svg { position: absolute; inset: 0; }
  .house { fill: var(--indigo700, #362d7c); }
  .spark { fill: var(--orange500, #f38b54); }
  .night { fill: var(--dark-bg, #14112e); }
  .tint { fill: var(--indigo100, #eeebfa); }
  .r { rx: var(--radius-lg, 16px); }
  .cv__text { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .cv__name { margin: 0; font-size: 120px; line-height: .92; font-weight: 800; color: var(--indigo900, #1f1a4d); letter-spacing: -1px; }
  .cv__tag { margin: 16px 0 0; font-size: 14px; line-height: 20px; color: var(--neutral600, #5f5b73); }
</style>
<div class="cv">
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
      blocks: indigo700 slab 240×232 (the house), orange500 160×96 (the spark), dark-bg 176×144, indigo100 tint 320×64; radius-lg corners
      arrangement: one tall slab with satellites, slab and dark block bleeding off top, right and bottom edges, all right of x=480
      pattern: literal motif, the shop awning from the logo: a row of five half-discs of radius space-lg (24px) hanging under the slab
      scales: space-lg 24 (scallop radius, 48 pitch), space-xl 32 and space-2xl 48 gaps, radius-lg 16
    -->
    <rect class="tint r" x="496" y="248" width="320" height="64"/>
    <rect class="house r" x="544" y="-16" width="240" height="216"/>
    <path class="house" d="M544 184 h240 v16 a24 24 0 0 1 -48 0 a24 24 0 0 1 -48 0 a24 24 0 0 1 -48 0 a24 24 0 0 1 -48 0 a24 24 0 0 1 -48 0 z"/>
    <rect class="spark r" x="816" y="48" width="176" height="96"/>
    <rect class="night r" x="816" y="176" width="176" height="144"/>
  </svg>
  <div class="cv__text">
    <h1 class="cv__name">TendIA</h1>
    <p class="cv__tag">Crédito basado en tu negocio, no en tu pasado bancario.</p>
  </div>
</div>
